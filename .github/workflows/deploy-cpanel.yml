# Deploy otomatis ke cPanel (Niagahoster) lewat FTPS (lftp) setiap ada push ke branch main.
# Secrets yang wajib diisi di GitHub → Settings → Secrets and variables → Actions:
#   FTP_SERVER      contoh: ftp.grandartoshotel.com  (atau IP server dari cPanel)
#   FTP_USERNAME    akun FTP khusus deploy, contoh: deploy@grandartoshotel.com
#   FTP_PASSWORD    password akun FTP tersebut
#   FTP_SERVER_DIR  folder tujuan relatif dari home akun FTP, WAJIB diakhiri "/", contoh: ./
# Opsional:
#   FTP_PROTOCOL    ftps (bawaan) atau ftp bila server tidak mendukung TLS
#   FTP_PORT        21 (bawaan)
name: Deploy ke cPanel

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'sync.bat'
      - '.gitignore'
      - '.gitattributes'
  workflow_dispatch:

concurrency:
  group: deploy-cpanel
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Ambil kode
        uses: actions/checkout@v5

      - name: Siapkan PHP 8.2
        uses: shivammathur/setup-php@2.31.1
        with:
          php-version: '8.2'
          coverage: none
          tools: none

      - name: Cek sintaks semua file PHP
        run: |
          set -e
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l > /dev/null
          echo "Semua file PHP lolos cek sintaks."

      - name: Pastikan file rahasia tidak ikut
        run: |
          for f in config/env.php config/vapid.php config/setup.lock setup.lock; do
            if [ -e "$f" ]; then echo "::error::$f tidak boleh ada di repository"; exit 1; fi
          done

      - name: Cek secrets
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
          D: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          missing=""
          [ -z "$S" ] && missing="$missing FTP_SERVER"
          [ -z "$U" ] && missing="$missing FTP_USERNAME"
          [ -z "$P" ] && missing="$missing FTP_PASSWORD"
          [ -z "$D" ] && missing="$missing FTP_SERVER_DIR"
          if [ -n "$missing" ]; then echo "::error::Secrets belum diisi:$missing"; exit 1; fi
          case "$D" in */) ;; *) echo "::error::FTP_SERVER_DIR harus diakhiri '/'"; exit 1;; esac

      - name: Siapkan file yang akan diupload
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/deploy"
          rsync -a ./ "$RUNNER_TEMP/deploy/"             --exclude '.git' --exclude '.github' --exclude '.gitignore' --exclude '.gitattributes'             --exclude 'sync.bat' --exclude '*.md'             --exclude 'config/env.php' --exclude 'config/vapid.php' --exclude 'config/setup.lock' --exclude 'setup.lock'
          echo "File yang akan diupload:"; (cd "$RUNNER_TEMP/deploy" && find . -type f | sort)

      - name: Pasang lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp > /dev/null

      - name: Upload ke cPanel (lftp)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          FTP_PROTOCOL: ${{ secrets.FTP_PROTOCOL }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          set -e
          PORT="${FTP_PORT:-21}"
          if [ "${FTP_PROTOCOL:-ftps}" = "ftp" ]; then
            SSL="set ftp:ssl-allow no;"
            echo "Mode: FTP biasa (tanpa TLS)"
          else
            SSL="set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no;"
            echo "Mode: FTPS (TLS)"
          fi
          # Tanpa --delete: file di server yang tidak ada di repo (env.php, foto upload, sesi, log) TIDAK dihapus.
          export LFTP_PASSWORD="$FTP_PASSWORD"
          lftp -u "$FTP_USERNAME" --env-password -p "$PORT" "$FTP_SERVER" <<LFTP
          $SSL
          set ftp:passive-mode true
          set net:timeout 30
          set net:max-retries 3
          set net:reconnect-interval-base 5
          set cmd:fail-exit true
          mirror --reverse --verbose=1 --parallel=4 --no-perms "$RUNNER_TEMP/deploy/" "$FTP_SERVER_DIR"
          set cmd:fail-exit false
          rm -f "$FTP_SERVER_DIR.ftp-deploy-sync-state.json"
          bye
          LFTP

      - name: Selesai
        run: echo "Deploy selesai → commit ${GITHUB_SHA::7}"
